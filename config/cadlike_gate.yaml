# ============================================================================
# CAD-like Gate Configuration
# ============================================================================
# Purpose: Auto-detect CAD-like PDFs (P&ID/PFD/ISO/Loop/Schematic) via scoring
# Spec: PVCFC_CADlike_Tag_Extraction_Handoff.md Section 3
# ============================================================================

# Feature weights (must sum to 1.0)
weights:
  producer_keyword: 0.20      # PDF metadata contains CAD vendor
  geometry_density: 0.15      # Vector paths/lines per area
  short_caps_rate: 0.15       # Ratio of 2-4 letter CAPS tokens
  regex_3piece_hits: 0.20     # 3-piece tag pattern matches
  technical_suffix: 0.10      # A/B/C, 2oo3, -201B presence
  non_a4_page: 0.05          # Large page size (A1/A0)
  multi_rotation: 0.05       # Rotated text spans
  leader_pattern: 0.10       # Thin lines ending near text

# Producer/Creator keywords to detect CAD software
producer_keywords:
  - AutoCAD
  - Autodesk
  - Bentley
  - AVEVA
  - Intergraph
  - EPLAN
  - Plant3D
  - CAD
  - MicroStation
  - SmartPlant

# 3-piece tag regex (AREA CODE NUM)
regex_3piece:
  pattern: "\\b\\d{2}\\s+[A-Z]{2,4}\\s+\\d{3,5}[A-Z]?\\b"
  per_page_cap: 20  # Max hits to count per page (avoid runaway)

# Thresholds
thresholds:
  cadlike: 0.55              # S >= 0.55 → CAD-like (lowered from 0.60 for P&ID Ammonia Unit)
  gray_zone_low: 0.45        # Gray zone [0.45, 0.55)
  gray_zone_boost_keywords: true  # Boost gray zone if filename has keywords

  # Hybrid detection thresholds (image-based fallback for scanned CADs)
  vector_confident: 0.55      # Vector score >= 0.55 → skip image analysis (fast path)
  vector_low: 0.20            # Vector score < 0.20 → rely heavily on image features
  image_high_confidence: 0.80 # Image score >= 0.80 → CAD-like with HIGH confidence
  image_gray_zone: 0.55       # Image score [0.55, 0.80) → gray zone (filename boost applies)

# Gray zone filename boost keywords
gray_zone_keywords:
  - P&ID
  - PFD
  - ISO
  - Loop
  - Schematic
  - Piping
  - Instrument
  - Drawing

# ============================================================================
# Image-Based Detection (for scanned CAD drawings)
# ============================================================================
# Triggered when vector_score < vector_confident threshold (0.55)
# Used to detect scanned CAD drawings that have no vector data

# Image feature weights (for image_score calculation)
image_weights:
  shape_density: 0.40    # Circles + rectangles (strongest indicator)
  line_density: 0.30     # Long lines via Hough transform
  edge_density: 0.30     # Canny edge detection (general complexity)

# Image processing configuration
image_processing:
  dpi: 300                      # Rendering resolution for image analysis
  max_pages_to_analyze: 3       # Analyze first 3 pages only (performance)

  # Shape detection parameters
  shapes:
    max_circles: 100            # Cap circles to prevent runaway detection
    max_rectangles: 300         # Cap rectangles to prevent runaway detection
    circle_min_radius: 5        # Minimum circle radius (pixels)
    circle_max_radius: 200      # Maximum circle radius (pixels)

  # Line detection parameters
  lines:
    min_line_length: 100        # Minimum line length (pixels)
    max_lines: 500              # Cap lines to prevent runaway detection

  # Edge density parameters
  edges:
    canny_low: 50               # Canny low threshold
    canny_high: 150             # Canny high threshold
    density_cap: 0.25           # Cap edge density at 25% (normalize outliers)

# Sampling configuration
sample_pages:
  strategy: "spread"  # spread: [1,2,3,mid,last]; full: all pages
  max_sample_count: 5  # Default 5 pages for gate evaluation

# Performance
max_gate_time_ms: 300  # Target << 300ms per file
