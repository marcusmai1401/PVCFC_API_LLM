# Redis Sentinel Configuration
# Auto-generated for PVCFC RAG API Week 1

# Monitor master named 'mymaster' at redis-master:6379 with quorum of 2
sentinel monitor mymaster redis-master 6379 2

# Authentication password for master (matches REDIS_PASSWORD in .env)
sentinel auth-pass mymaster pvcfc_redis_2025_secure

# Master considered down after 5 seconds of no response
sentinel down-after-milliseconds mymaster 5000

# Only 1 replica will be reconfigured at a time during failover
sentinel parallel-syncs mymaster 1

# Failover timeout of 10 seconds (target: < 10s failover)
sentinel failover-timeout mymaster 10000

# Deny runtime script reconfiguration for security
sentinel deny-scripts-reconfig yes

# Log level
loglevel notice
