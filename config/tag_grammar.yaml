# ============================================================================
# Tag Grammar & Assembler Configuration
# ============================================================================
# Purpose: Define tag component patterns and assembly rules
# Spec: PVCFC_CADlike_Tag_Extraction_Handoff.md Section 6
# ============================================================================

# ===== TAG COMPONENT REGEXES =====

# AREA: 2-digit number (e.g., "04", "10")
area_regex: "^[0-9]{2}$"

# CODE: 2-4 letter CAPS from whitelist
code_regex: "^[A-Z]{2,4}$"

# NUM: 3-5 digits with optional trailing letter (e.g., "2207", "2046A")
num_regex: "^[0-9]{3,5}[A-Z]?$"

# CODE whitelist (instrument types)
# Expandable per plant; add unknown codes from learning mode logs
code_whitelist:
  - PAL      # Pressure alarm low
  - PSAH     # Pressure switch alarm high
  - PSAL     # Pressure switch alarm low
  - PALL     # Pressure alarm low-low
  - PT       # Pressure transmitter
  - PI       # Pressure indicator
  - PIC      # Pressure indicator controller
  - FIC      # Flow indicator controller
  - HIC      # Hand indicator controller
  - LIC      # Level indicator controller
  - TIC      # Temperature indicator controller
  - PXI      # Pressure indicator (variant)
  - PSU      # Pressure switch unit
  - IS       # Instrument switch
  - FT       # Flow transmitter
  - TT       # Temperature transmitter
  - LT       # Level transmitter
  - FSL      # Flow switch low
  - TSH      # Temperature switch high
  - LSH      # Level switch high
  - LSAH     # Level switch alarm high
  - TSHH     # Temperature switch high-high

# SUFFIX candidates (optional components)
suffix_patterns:
  - "^[A-Z]/[A-Z](?:/[A-Z])?$"        # A/B, A/B/C
  - "^[1-3]oo[2-4]$"                  # 1oo2, 2oo3 (voting logic)
  - "^-?[0-9]{3,5}[A-Z]?$"           # -201B, -2208
  - "^[0-9]{3,5}[A-Z]$"              # 2208A (as separate token)

# ===== ASSEMBLER CONFIGURATION =====

# Anchor component (vertical triplet center)
anchor: CODE

# Tolerances for vertical alignment
x_center_tolerance_ratio: 0.60       # |Δx_center| <= 0.60 * min(width_AREA, width_NUM)
y_gap_ratio_range: [0.7, 2.0]       # Gap ∈ [0.7, 2.0] * median(font_height)
font_size_delta_pt: 1.5              # |Δfont_size| <= 1.5 pt
rotation_tolerance_deg: 15           # <= 15° misalignment

# Scoring weights (sum for accepted triplet)
score_weights:
  triplet_regex: 4      # +4 if AREA+CODE+NUM regex match in order
  x_align: 2            # +2 for x-center alignment quality
  y_uniform: 2          # +2 for vertical spacing uniformity
  font_sim: 2           # +2 for font-size similarity
  alarm_hint: 1         # +1 if alarm triangle near ROI and CODE in {PAL,PSAL,PSAH}

# Pass threshold
pass_threshold: 6  # Accept triplet if score >= 6

# Suffix attachment radius (multiple of median font height)
suffix_radius_em: 1.0  # Expand union bbox by 1.0em to search for suffix

# Divider line handling
ignore_divider_lines_in_bubbles: true  # Don't break on horizontal lines inside instrument bubbles

# ===== LEARNING MODE =====

# Log unknown CAPS tokens for whitelist expansion
learning_mode:
  enabled: true
  log_unknown_caps: true
  min_token_length: 2
  max_token_length: 4
  log_path: "artifacts/logs/unknown_codes.jsonl"
