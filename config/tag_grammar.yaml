# ============================================================================
# Tag Grammar & Assembler Configuration
# ============================================================================
# Purpose: Define tag component patterns and assembly rules
# Spec: PVCFC_CADlike_Tag_Extraction_Handoff.md Section 6
# ============================================================================

# ===== TAG COMPONENT REGEXES =====

# UNIT: 1-3 digit number (e.g., "4", "04", "120")
unit_regex: "^[0-9]{1,3}$"

# PREFIX: 1-6 letter CAPS from whitelist (e.g., "I", "IS", "PSAL", "PAHH", "PDAHH")
prefix_regex: "^[A-Z]{1,6}$"

# SUFFIX: 3-5 digits only, no letters (e.g., "501", "2207", "5153")
suffix_regex: "^[0-9]{3,5}$"

# VARIANT: Single letter after suffix (e.g., "A", "B", "C")
variant_regex: "^[A-Z]$"

# PREFIX whitelist (instrument types)
# EXPANDED for Ammonia Unit P&ID Rev12 compatibility
# Includes all prefixes from ground truth test cases + comprehensive ISA 5.1 coverage
prefix_whitelist:
  # Pressure instruments
  - PAL      # Pressure alarm low
  - PAH      # Pressure alarm high
  - PAHH     # Pressure alarm high-high
  - PALL     # Pressure alarm low-low
  - PSAH     # Pressure switch alarm high
  - PSAL     # Pressure switch alarm low
  - PSV      # Pressure safety valve
  - PT       # Pressure transmitter
  - PI       # Pressure indicator
  - PG       # Pressure gauge
  - PIC      # Pressure indicator controller
  - PCV      # Pressure control valve
  - PV       # Pressure valve
  - PXI      # Pressure indicator (variant)
  - PSU      # Pressure switch unit
  - PXT      # Pressure transmitter (extended)
  - PY       # Pressure relay
  - PDI      # Pressure differential indicator
  - PDT      # Pressure differential transmitter
  - PDAH     # Pressure differential alarm high
  - PDAHH    # Pressure differential alarm high-high
  - PDALL    # Pressure differential alarm low-low
  # Flow instruments
  - FIC      # Flow indicator controller
  - FT       # Flow transmitter
  - FI       # Flow indicator
  - FE       # Flow element
  - FY       # Flow relay
  - FV       # Flow valve
  - FFI      # Flow flow indicator
  - FFU      # Flow flow unit
  - FSL      # Flow switch low
  - FFSAL    # Flow flow switch alarm low
  # Level instruments
  - LIC      # Level indicator controller
  - LT       # Level transmitter
  - LI       # Level indicator
  - LG       # Level gauge
  - LS       # Level switch
  - LSL      # Level switch low
  - LSH      # Level switch high
  - LSHH     # Level switch high-high
  - LSLL     # Level switch low-low
  - LSAH     # Level switch alarm high
  - LAH      # Level alarm high
  - LAL      # Level alarm low
  - LAHH     # Level alarm high-high
  - LALL     # Level alarm low-low
  - LY       # Level relay
  # Temperature instruments
  - TI       # Temperature indicator
  - TIC      # Temperature indicator controller
  - TT       # Temperature transmitter
  - TE       # Temperature element
  - TCV      # Temperature control valve
  - TXI      # Temperature transmitter indicator
  - TSH      # Temperature switch high
  - TSHH     # Temperature switch high-high
  - TAH      # Temperature alarm high
  - TAL      # Temperature alarm low
  - TAHH     # Temperature alarm high-high
  # Hand/Manual
  - HIC      # Hand indicator controller
  # Equipment/Misc
  - IS       # Instrument switch
  - PU       # Pump
  - MU       # Motor
  - HE       # Heat exchanger
  - VL       # Valve
  - ZI       # Position indicator
  - ZSL      # Position switch low
  - STR      # Strainer
  - EJ       # Ejector
  - AP       # Analyzer pressure
  - AE       # Analyzer element
  - I        # Indicator (generic single-letter)

# ANNOTATION patterns (separate from core tag components)
# These are NOT part of the core tag but provide additional context
annotation_patterns:
  - "^[A-Z]/[A-Z](?:/[A-Z])?$"        # A/B, A/B/C (choice notation)
  - "^[1-3]oo[2-4]$"                  # 1oo2, 2oo3 (voting logic)

# ===== ASSEMBLER CONFIGURATION =====

# Anchor component (vertical triplet center)
anchor: PREFIX

# Tolerances for vertical alignment
# LOOSENED to capture tags in instrument symbols/bubbles
x_center_tolerance_ratio: 3.5        # |Δx_center| <= 3.5 * min(width_UNIT, width_SUFFIX) (loosened for symbol tags)
y_gap_ratio_range: [0.2, 3.5]       # Gap ∈ [0.2, 3.5] * median(font_height) (loosened for stacked text in bubbles)
font_size_delta_pt: 1.5              # |Δfont_size| <= 1.5 pt (loosened for mixed sizes)
rotation_tolerance_deg: 15           # <= 15° misalignment (loosened)

# Scoring weights (sum for accepted triplet)
score_weights:
  triplet_regex: 4      # +4 if UNIT+PREFIX+SUFFIX regex match in order
  x_align: 2            # +2 for x-center alignment quality
  y_uniform: 2          # +2 for vertical spacing uniformity
  font_sim: 2           # +2 for font-size similarity
  alarm_hint: 1         # +1 if alarm triangle near ROI and PREFIX in {PAL,PSAL,PSAH,PAHH}

# Pass threshold
# LOWERED to extract more genuine tags including those in instrument symbols
pass_threshold: 4  # Accept triplet if score >= 4 (lowered from 5 to capture symbol tags)

# Variant/annotation attachment radius (multiple of median font height)
variant_radius_em: 0.5    # Expand bbox by 0.5em to search for variant (A/B/C) - very close
annotation_radius_em: 1.5  # Expand bbox by 1.5em to search for annotation (A/B/C, 1oo2) - can be farther

# Divider line handling
ignore_divider_lines_in_bubbles: true  # Don't break on horizontal lines inside instrument bubbles

# ===== LEARNING MODE =====

# Log unknown CAPS tokens for whitelist expansion
learning_mode:
  enabled: true
  log_unknown_caps: true
  min_token_length: 2
  max_token_length: 4
  log_path: "artifacts/logs/unknown_codes.jsonl"
