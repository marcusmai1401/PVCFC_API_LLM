version: '3.8'

# Redis High Availability Stack with Sentinel
# Architecture:
#   - 1 master (read/write)
#   - 1 replica (read-only, promoted to master on failover)
#   - 3 sentinels (quorum=2 for automatic failover)

networks:
  redis-ha:
    driver: bridge
    name: redis-ha-network

volumes:
  redis-master-data:
    driver: local
  redis-replica-1-data:
    driver: local

services:
  # ==========================================
  # Redis Master
  # ==========================================
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    hostname: redis-master
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    networks:
      redis-ha:
        aliases:
          - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - TZ=Asia/Ho_Chi_Minh

  # ==========================================
  # Redis Replica 1
  # ==========================================
  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-replica-1-data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --replicaof redis-master 6379
      --requirepass ${REDIS_PASSWORD:-changeme}
      --masterauth ${REDIS_PASSWORD:-changeme}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - TZ=Asia/Ho_Chi_Minh

  # ==========================================
  # Redis Sentinel 1
  # ==========================================
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    restart: unless-stopped
    ports:
      - "26379:26379"
    entrypoint: ["/bin/sh", "/sentinel-entrypoint.sh"]
    volumes:
      - ./config/sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./config/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_started
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}

  # ==========================================
  # Redis Sentinel 2
  # ==========================================
  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    restart: unless-stopped
    ports:
      - "26380:26379"
    entrypoint: ["/bin/sh", "/sentinel-entrypoint.sh"]
    volumes:
      - ./config/sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./config/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_started
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}

  # ==========================================
  # Redis Sentinel 3
  # ==========================================
  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    restart: unless-stopped
    ports:
      - "26381:26379"
    entrypoint: ["/bin/sh", "/sentinel-entrypoint.sh"]
    volumes:
      - ./config/sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./config/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_started
    networks:
      - redis-ha
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}

# ==========================================
# Usage:
# ==========================================
# 1. Start the stack:
#    docker compose -f docker-compose.redis-ha.yml up -d
#
# 2. Check sentinel status:
#    docker exec redis-sentinel-1 redis-cli -p 26379 sentinel masters
#
# 3. Check replication status:
#    docker exec redis-master redis-cli -a changeme info replication
#
# 4. Test failover (stop master):
#    docker stop redis-master
#    # Watch sentinels promote replica to master (~5-10 seconds)
#
# 5. Check logs:
#    docker compose -f docker-compose.redis-ha.yml logs -f redis-sentinel-1
#
# ==========================================
# Environment Variables:
# ==========================================
# REDIS_PASSWORD: Redis authentication password (default: changeme)
#                 Set this in .env file for production
#
# ==========================================
# Network Ports:
# ==========================================
# 6379  - Redis master
# 6380  - Redis replica-1
# 26379 - Sentinel-1
# 26380 - Sentinel-2
# 26381 - Sentinel-3
