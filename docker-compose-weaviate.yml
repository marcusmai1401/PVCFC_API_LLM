version: '3.8'

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.5
    container_name: weaviate-pvcfc
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"  # gRPC port
    environment:
      # Query settings
      QUERY_DEFAULTS_LIMIT: 25

      # Authentication (disabled for local dev)
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'

      # Persistence
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'

      # Vectorizer (none - we provide vectors manually from Gemini)
      DEFAULT_VECTORIZER_MODULE: 'none'

      # Cluster settings
      CLUSTER_HOSTNAME: 'node1'

      # Performance tuning for Windows/RTX 4060
      GOGC: '100'
      GOMEMLIMIT: '4GiB'

      # Enable CORS for development
      ORIGIN: '*'

      # Disable telemetry
      DISABLE_TELEMETRY: 'true'

    volumes:
      - weaviate_data:/var/lib/weaviate

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  weaviate_data:
    driver: local

networks:
  default:
    name: weaviate-network
