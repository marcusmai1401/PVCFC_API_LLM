[server]
# Maximum size for uploaded files (in MB)
maxUploadSize = 200

# Maximum size for message payloads (in MB)
maxMessageSize = 200

# Enable file watching to auto-reload on changes
fileWatcherType = "auto"

# Run on port 8501 (default)
port = 8501

# CORS settings (fixed conflict with XSRF protection)
# Option 1: Keep XSRF protection (recommended for security)
enableCORS = true
enableXsrfProtection = true

# Option 2: If you need open CORS, disable XSRF (less secure)
# enableCORS = true
# enableXsrfProtection = false

# Enable hot reloading
runOnSave = true

[browser]
# Server address for the browser
serverAddress = "localhost"

[theme]
# iOS/macOS light theme
primaryColor = "#0A84FF"         # iOS blue
backgroundColor = "#F5F5F7"       # iOS light grey
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
font = "sans serif"

[runner]
# Magic commands are enabled by default
magicEnabled = true

# Fast reruns enabled
fastReruns = true

[client]
# Show error details
showErrorDetails = true
